[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-ner"
version = "0.1.0"
description = "High-precision Russian NER for banking search queries"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "pandas>=2.2",
]
training = [
  "gliner2[local]>=1.3,<2",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bank_ner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
